name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Native Helper
        run: python -m py_compile native/host.py

      - name: Build extension artifact
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath Douyin-HD-Pro-Extension-CI.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-HD-Pro-Extension-CI
          path: Douyin-HD-Pro-Extension-CI.zip
