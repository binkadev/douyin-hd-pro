name: Kiểm tra mã nguồn
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra Python và JavaScript
        run: |
          python -m py_compile native/host.py native/host_core.py
          node --check extension/background.js
          node --check extension/background/core.js
          node --check extension/background/capture.js
          node --check extension/background/download.js
          node --check extension/i18n.js
          node --check extension/i18n-v104.js
          node --check extension/i18n-v110.js
          node --check extension/content.js
          node --check extension/popup.js
      - name: Kiểm tra manifest và 10 ngôn ngữ
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('extension')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']==pathlib.Path('VERSION.txt').read_text().strip()
          locales=list((root/'_locales').glob('*/messages.json'))
          assert len(locales)==10, f'Cần đúng 10 locale, hiện có {len(locales)}'
          for p in locales: json.loads(p.read_text())
          print('OK: manifest + 10 locale')
          PY
